name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Aquí sí hay Docker: se construyen las imágenes de producción para comprobar que los Dockerfile funcionan.
  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password-only-for-build
      POSTGRES_DB: ci
      SECRET_KEY: ci-secret-key-only-for-build-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml build
      - name: La web (nginx) sirve la app con sus cabeceras, el manifiesto y el proxy a la API
        run: |
          docker compose -f docker-compose.prod.yml up -d
          for i in $(seq 1 40); do curl -fs -o /dev/null http://localhost/ && break; sleep 2; done
          H=$(curl -sI http://localhost/)
          echo "$H"
          echo "$H" | grep -qi "content-security-policy" || { echo "FALTA la CSP en /"; exit 1; }
          echo "$H" | grep -qi "x-frame-options: DENY" || { echo "FALTA X-Frame-Options en /"; exit 1; }
          curl -sI http://localhost/sw.js | grep -qi "cache-control: no-cache" || { echo "sw.js no debe cachearse"; exit 1; }
          curl -sf http://localhost/manifest.webmanifest | grep -q '"Plata Clara"' || { echo "manifiesto no servido"; exit 1; }
          curl -sfI http://localhost/icons/icon-512.png > /dev/null || { echo "ícono no servido"; exit 1; }
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/auth/me)
          [ "$CODE" = "401" ] || { echo "el proxy a la API falló (código $CODE, se esperaba 401)"; exit 1; }
          echo "Web, manifiesto y proxy correctos"
      - name: La API arranca y aplica las migraciones sobre PostgreSQL
        run: |
          docker compose -f docker-compose.prod.yml up -d db backend
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T backend python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"; then
              echo "API arriba"; exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml logs backend
          exit 1
