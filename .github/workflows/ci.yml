name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Aquí sí hay Docker: se construyen las imágenes de producción para comprobar que los Dockerfile funcionan.
  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password-only-for-build
      POSTGRES_DB: ci
      SECRET_KEY: ci-secret-key-only-for-build-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml build
      - name: La API migra sobre PostgreSQL y nginx sirve la app (cabeceras, manifiesto y proxy)
        run: |
          C="docker compose -f docker-compose.prod.yml"
          # Cada falla deja un mensaje público (::error::) con el motivo y las últimas líneas del backend.
          fail() {
            echo "::error::$1"
            echo "::error::backend (últimas líneas): $($C logs --no-color --tail 20 backend 2>&1 | tr '\n' '|')"
            exit 1
          }
          $C up -d

          # 1) La API tarda en estar lista (aplica las migraciones al arrancar): se espera a que conteste por nginx.
          code=""
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/auth/me || true)
            [ "$code" = "401" ] && break
            sleep 2
          done
          [ "$code" = "401" ] || fail "la API no respondió a través de nginx en 2 minutos (último código: $code; se esperaba 401)"
          $C exec -T backend python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)" \
            || fail "/health/ready falló: la base de datos no responde"

          # 2) La web: cabeceras de seguridad, service worker, manifiesto e íconos.
          H=$(curl -sI http://localhost/)
          echo "$H"
          echo "$H" | grep -qi "content-security-policy" || fail "falta la CSP en /"
          echo "$H" | grep -qi "x-frame-options: DENY" || fail "falta X-Frame-Options en /"
          curl -sI http://localhost/sw.js | grep -qi "cache-control: no-cache" || fail "sw.js no debe guardarse en caché"
          curl -sf http://localhost/manifest.webmanifest | grep -q '"Plata Clara"' || fail "el manifiesto no se sirve"
          curl -sfI http://localhost/icons/icon-512.png > /dev/null || fail "el ícono no se sirve"
          echo "API, migraciones, web, manifiesto y proxy correctos"
