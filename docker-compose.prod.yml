# Despliegue de producción: web (nginx) → API → PostgreSQL. Solo la web queda expuesta.
#   docker compose -f docker-compose.prod.yml up -d --build
# Requiere un .env con ENVIRONMENT=production y una SECRET_KEY real (la API no arranca sin ella).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env}
      ENVIRONMENT: production
      TIMEZONE: ${TIMEZONE:-America/Bogota}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    # Sin "ports": a la API solo se llega a través de nginx (la red interna de Docker).
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
