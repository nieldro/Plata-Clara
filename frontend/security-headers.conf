# Cabeceras de seguridad de la web. Se incluye en cada `location` que sirve la app.
# (En nginx, un `add_header` dentro de un location anula TODOS los del bloque server: por eso se repite con include.)
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# Los logos de bancos salen del favicon de Google (www.google.com redirige a *.gstatic.com); los recibos, de blob:.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com https://*.gstatic.com; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
