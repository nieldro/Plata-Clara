# Sirve la web (SPA) y reenvía /api al backend. Pensado para correr detrás de docker-compose.prod.yml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Los recibos pueden pesar hasta 5 MB (+ margen del formulario).
    client_max_body_size 6m;

    # --- API ---
    # La API pone sus propias cabeceras de seguridad (FastAPI), por eso aquí no se repiten.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Se SOBRESCRIBE (no se acumula) con la IP real de la conexión: así nadie puede inventarse otra IP
        # en esta cabecera para saltarse el límite de intentos de inicio de sesión.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- web ---
    # Los archivos compilados llevan un hash en el nombre: se pueden guardar un año.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El service worker nunca debe quedar en caché: si no, las actualizaciones de la app no llegarían.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    # Cualquier otra ruta devuelve la app (es una SPA); index.html nunca se guarda en caché.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
