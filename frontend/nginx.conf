# Sirve la web (SPA) y reenvía /api al backend. Pensado para correr detrás de docker-compose.prod.yml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Los recibos pueden pesar hasta 5 MB (+ margen del formulario).
    client_max_body_size 6m;

    # --- cabeceras de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    # Los logos de bancos salen del favicon de Google (www.google.com redirige a *.gstatic.com); los recibos, de blob:.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google.com https://*.gstatic.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # --- API ---
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # Se SOBRESCRIBE (no se acumula) con la IP real de la conexión: así nadie puede inventarse otra IP
        # en esta cabecera para saltarse el límite de intentos de inicio de sesión.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- web ---
    # Los archivos compilados llevan un hash en el nombre: se pueden guardar un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Cualquier otra ruta devuelve la app (es una SPA); index.html nunca se guarda en caché.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
